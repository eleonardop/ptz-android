name: Compilar APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Testes e compilação
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleDebug 2>&1 | tee build.log

      - name: Mostrar erros da compilação
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:|What went wrong|FAILED|Test.*FAILED|AssertionError|expected" -A3 build.log | head -80 > errors.txt || true
          while IFS= read -r line; do echo "::error::${line}"; done < errors.txt
          cat errors.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Relatório dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-testes
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Preparar APK
        id: apk
        shell: bash
        run: |
          name="PTZ-Studio-Android-0.1.${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$name"
          echo "file=$name" >> "$GITHUB_OUTPUT"
          echo "### APK pronto: $name" >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.file }}
          path: ${{ steps.apk.outputs.file }}

      - name: Publicar na página de Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" "${{ steps.apk.outputs.file }}" \
            --title "PTZ Studio Android 0.1.${GITHUB_RUN_NUMBER}" \
            --notes "APK para instalar no celular (Android 8 ou mais novo). Baixe o arquivo .apk abaixo pelo próprio celular e abra para instalar." \
            --latest
